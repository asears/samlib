[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samlib"
version = "0.1.0"
description = "Simple Agent/Actor Model Library for Python"
requires-python = ">=3.9"
dependencies = [
    "typing_extensions>=4.0.0",
    "asyncio>=3.4.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "pytest-benchmark[histogram]",
    "ruff",
    "uv",
    "mypy",
    "pyrefly",
    "vulture",
    "radon",
]

[tool.ruff]
select = ["E", "F", "B", "I"]
ignore = []
line-length = 100

[tool.black]
line-length = 100
target-version = ['py39']
